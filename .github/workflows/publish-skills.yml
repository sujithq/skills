name: Publish Skills

on:
  push:
    tags:
      - 'v*'

env:
  GH_VERSION: '2.92.0'  # Control gh CLI version here

permissions:
  contents: write
  pull-requests: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install conventional-changelog
        run: npm install -g conventional-changelog-cli

      - name: Generate changelog
        run: |
          conventional-changelog -p angular -i CHANGELOG.md -s
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add CHANGELOG.md
          git commit -m "docs: update changelog for ${{ github.ref_name }}" || echo "No changes to commit"
          git push origin HEAD:main || echo "Push failed (may have no changes)"

      - name: Install GitHub CLI
        run: |
          VERSION=${{ env.GH_VERSION }}
          DOWNLOAD_URL="https://github.com/cli/cli/releases/download/v${VERSION}/gh_${VERSION}_linux_amd64.tar.gz"
          
          echo "Installing gh v${VERSION}"
          wget -q "${DOWNLOAD_URL}"
          tar xzf gh_${VERSION}_linux_amd64.tar.gz
          sudo mv gh_${VERSION}_linux_amd64/bin/gh /usr/local/bin/gh
          rm -rf gh_${VERSION}_linux_amd64*
          gh --version

      - name: Publish skills
        run: gh skill publish --tag ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
